# Grades a "Submit your MCP server" issue and opens a pull request with the registry entry.
# The issue text is untrusted. It never reaches a shell: scripts/submission.mjs reads it from the
# event file ($GITHUB_EVENT_PATH). The checker reads the submitted repository's source as text and
# runs nothing from it. All writes go to this repository: one comment on the issue, labels, one
# branch and one pull request per issue.
name: Submission

on:
  issues:
    types: [opened, edited]

permissions: {}

concurrency:
  group: submission-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  submission:
    if: >-
      github.repository == 'isokron-ai/mcp-check-registry' &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the pinned checker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check, comment and open the pull request
        run: node scripts/submission.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
