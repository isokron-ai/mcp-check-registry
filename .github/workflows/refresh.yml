# Nightly: re-reads every listed server's source and its ci/owner marks from its default branch.
# Opens at most one pull request in this repository with the entries that changed, and closes
# the older refresh pull request it supersedes. It never comments anywhere else.
name: Refresh

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'isokron-ai/mcp-check-registry'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/entry.mjs --check
      - name: Re-scan and open one pull request with the changes
        run: node scripts/refresh.mjs --pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
